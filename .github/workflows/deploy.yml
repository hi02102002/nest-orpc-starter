name: Deploy

# Runs after CI finishes on main. Deploys only when CI passed and the
# head commit message contains "deploy" (case-insensitive).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & push images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, 'deploy')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: server
            build-args: ""
          - app: web
            build-args: |
              VITE_SERVER_URL=${{ vars.VITE_SERVER_URL }}
              SERVER_URL=http://server:8080
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.app }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.app }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to server
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            sudo docker compose pull server web
            sudo docker compose up -d --no-build --remove-orphans
            sudo docker image prune -f
