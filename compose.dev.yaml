# Local development database and S3-compatible storage (RustFS). Production
# images live in compose.yaml.
# Defaults match DATABASE_URL=postgresql://postgres:password@localhost:5432/postgres
# and the S3_* values in apps/server/.env.schema.
name: nest-orpc-starter-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfs-dev-secret}
      # Browsers upload straight to presigned URLs, so the web origin needs CORS.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${S3_CORS_ORIGIN:-http://localhost:3333}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Creates the bucket (idempotent). Run by `pnpm db:up`; the profile keeps it
  # out of `up --wait`, which treats an exited container as a failure.
  s3-init:
    image: rustfs/rustfs:1.0.3
    profiles: [init]
    depends_on:
      s3:
        condition: service_healthy
    entrypoint:
      - curl
      - -sf
      - --aws-sigv4
      - aws:amz:us-east-1:s3
      - --user
      - ${S3_ACCESS_KEY_ID:-rustfsadmin}:${S3_SECRET_ACCESS_KEY:-rustfs-dev-secret}
      - -X
      - PUT
      - http://s3:9000/${S3_BUCKET:-petshop}
    restart: "no"

volumes:
  db-data:
  s3-data:
